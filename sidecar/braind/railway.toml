# Deploy with braind/ as archive root:
#   cd sidecar/braind && railway up --service braind -d -m "braind"
# Or: ./scripts/deploy-railway.sh braind

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/app/braind"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# No healthcheckPath — this is a worker, not an HTTP server.
